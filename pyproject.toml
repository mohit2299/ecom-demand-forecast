[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "demandcast"
version = "0.1.0"
description = "Leakage-safe e-commerce demand forecasting: traffic x conversion x order value, with paid-media effects"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "pandas>=2.2", "statsmodels>=0.14", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7", "nbformat", "nbclient", "ipykernel", "nbstripout"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
